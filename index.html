<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>West Lake Hiking Trails</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #map { width: 100vw; height: 100vh; }

  .panel {
    position: absolute;
    z-index: 1000;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    padding: 11px 24px;
    border-radius: 999px;
    background: rgba(245, 248, 239, 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 22px rgba(42, 64, 42, 0.18);
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.72);
  }

  .brand-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.15;
    color: #2f4a32;
  }

  .stats-panel, .explore-panel, .track-panel, .profile-panel, .opacity-panel {
    position: absolute;
    z-index: 1000;
    background: rgba(255,255,255,.94);
    border: 1px solid rgba(255,255,255,.72);
    border-radius: 12px;
    box-shadow: 0 2px 14px rgba(0,0,0,.16);
  }

  .stats-panel {
    top: 18px;
    right: 14px;
    width: 278px;
    padding: 12px;
    box-sizing: border-box;
  }

  .stats-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 9px;
    color: #2f4a32;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .stat {
    padding: 8px 9px;
    border-radius: 8px;
    background: rgba(245, 248, 239, 0.84);
    border: 1px solid rgba(47, 74, 50, 0.10);
    min-width: 0;
  }

  .stat-value {
    font-size: 16px;
    line-height: 1.1;
    font-weight: 750;
    color: #263e2a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stat-label {
    margin-top: 4px;
    font-size: 11px;
    color: rgba(47, 74, 50, 0.70);
  }

  .explore-panel {
    top: 174px;
    right: 14px;
    width: 278px;
    padding: 12px;
    box-sizing: border-box;
    color: #2f4a32;
  }

  .explore-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .explore-title {
    font-size: 14px;
    font-weight: 750;
  }

  .explore-count {
    font-size: 13px;
    font-weight: 700;
    color: #39704b;
  }

  .explore-progress {
    height: 6px;
    margin: 9px 0 8px;
    overflow: hidden;
    border-radius: 999px;
    background: #e5e9e1;
  }

  .explore-progress-bar {
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #5d8d62, #2d6848);
    transition: width .25s ease;
  }

  .explore-legend {
    display: flex;
    gap: 12px;
    margin-bottom: 9px;
    font-size: 11px;
    color: rgba(47, 74, 50, .72);
  }

  .legend-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 4px;
    border-radius: 50%;
    vertical-align: 0;
  }

  .legend-dot.visited { background: #2f7b51; }
  .legend-dot.unvisited { border: 1.5px solid #7a8078; box-sizing: border-box; }

  .explore-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }

  .explore-actions button {
    border: 1px solid rgba(47, 74, 50, .18);
    border-radius: 9px;
    padding: 7px 8px;
    background: #f7f9f4;
    color: #2f4a32;
    font-size: 12px;
    font-weight: 650;
    cursor: pointer;
  }

  .explore-actions button:hover { background: #eef3ea; }
  .explore-actions button.is-active { background: #2f6849; color: #fff; }

  .location-status {
    min-height: 16px;
    margin-top: 8px;
    font-size: 11px;
    line-height: 1.45;
    color: rgba(47, 74, 50, .76);
  }

  .peak-marker {
    display: grid;
    width: 20px;
    height: 20px;
    place-items: center;
    border: 2px solid #777e77;
    border-radius: 50% 50% 50% 0;
    box-sizing: border-box;
    background: rgba(255,255,255,.94);
    color: #727872;
    font-size: 10px;
    font-weight: 800;
    transform: rotate(-45deg);
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }

  .peak-marker span { transform: rotate(45deg); }
  .peak-marker.visited { border-color: #276947; background: #2f7b51; color: #fff; }

  .you-are-here {
    width: 16px;
    height: 16px;
    border: 3px solid #fff;
    border-radius: 50%;
    box-sizing: border-box;
    background: #3478f6;
    box-shadow: 0 0 0 2px #3478f6, 0 2px 8px rgba(0,0,0,.28);
  }

  .track-panel {
    bottom: 18px;
    left: 14px;
    width: 410px;
    max-width: calc(100vw - 28px);
    max-height: 58vh;
    font-size: 13px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .track-panel-header {
    padding: 10px 12px 8px;
    border-bottom: 1px solid rgba(0,0,0,.08);
  }

  .track-panel-title {
    font-weight: 700;
    margin-bottom: 8px;
  }

  .drawer-toggle {
    display: none;
  }

  .toolbar {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .toolbar button {
    border: 1px solid rgba(0,0,0,.16);
    background: #fff;
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 12px;
    cursor: pointer;
  }

  .toolbar button:hover {
    background: #f4f4f4;
  }

  .search {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid rgba(0,0,0,.16);
    border-radius: 8px;
    padding: 7px 9px;
    font-size: 13px;
  }

  .selected-info {
    display: none;
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(245, 248, 239, 0.92);
    border: 1px solid rgba(47, 74, 50, 0.16);
    color: #2f4a32;
    line-height: 1.45;
  }

  .selected-info-title {
    font-weight: 700;
    margin-bottom: 2px;
  }

  .selected-info-meta {
    font-size: 12px;
    color: rgba(47, 74, 50, 0.78);
  }

  .tree {
    overflow: auto;
    padding: 8px 8px 10px;
  }

  details {
    margin: 2px 0;
  }

  summary {
    cursor: pointer;
    user-select: none;
    padding: 5px 6px;
    border-radius: 7px;
    font-weight: 650;
  }

  summary:hover {
    background: rgba(0,0,0,.05);
  }

  .month summary {
    font-weight: 600;
    margin-left: 10px;
  }

  .track-item {
    display: grid;
    grid-template-columns: 18px 16px 44px minmax(0, 1fr);
    align-items: center;
    gap: 7px;
    padding: 6px 8px 6px 28px;
    border-radius: 8px;
    cursor: pointer;
    line-height: 1.25;
  }

  .track-item:hover {
    background: rgba(0,0,0,.06);
  }

  .track-item.active {
    background: rgba(47, 74, 50, 0.10);
    font-weight: 650;
  }

  .track-check {
    width: 16px;
    height: 16px;
    margin: 0;
    accent-color: #2f6b4a;
    cursor: pointer;
  }

  .swatch {
    width: 16px;
    height: 4px;
    border-radius: 3px;
    flex: 0 0 auto;
  }

  .track-date {
    font-variant-numeric: tabular-nums;
    color: #444;
    white-space: nowrap;
  }

  .track-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty {
    color: #666;
    padding: 10px;
    display: none;
  }

  .profile-panel {
    right: 14px;
    bottom: 72px;
    width: 380px;
    max-width: calc(100vw - 28px);
    padding: 12px;
    box-sizing: border-box;
    display: none;
  }

  .profile-title {
    font-size: 13px;
    font-weight: 700;
    color: #2f4a32;
  }

  .profile-meta {
    margin-top: 3px;
    font-size: 12px;
    color: rgba(47, 74, 50, 0.74);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #elevationCanvas {
    display: block;
    width: 100%;
    height: 150px;
    margin-top: 9px;
  }

  .opacity-panel {
    right: 14px;
    bottom: 18px;
    padding: 10px 12px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .opacity-panel input {
    width: 140px;
  }

  .opacity-panel label {
    font-weight: 600;
  }

  .opacity-panel span {
    min-width: 36px;
    text-align: right;
  }

  @media (max-width: 900px) {
    .stats-panel {
      top: 70px;
      left: 14px;
      right: auto;
      width: 292px;
    }

    .explore-panel { top: 226px; }
  }

  @media (max-width: 640px) {
    .panel {
      top: 10px;
      padding: 8px 16px;
    }

    .brand-title {
      font-size: 16px;
      letter-spacing: 0.04em;
    }

    .stats-panel {
      top: 58px;
      left: 10px;
      right: 10px;
      width: auto;
      padding: 7px 10px;
      border-radius: 10px;
    }

    .explore-panel {
      top: 112px;
      right: 10px;
      width: 208px;
      padding: 9px 10px;
      border-radius: 11px;
    }

    .explore-progress { margin: 6px 0; }
    .explore-legend { display: none; }
    .explore-actions button { padding: 6px 5px; }
    .location-status { margin-top: 6px; }

    .stats-title {
      display: none;
    }

    .stats-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .stat {
      padding: 0;
      border: 0;
      background: transparent;
    }

    .stat-value {
      font-size: 12px;
    }

    .stat-label {
      margin-top: 1px;
      font-size: 9px;
    }

    .track-panel {
      left: 10px;
      right: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));
      width: auto;
      max-width: none;
      height: min(58vh, 430px);
      max-height: calc(100vh - 126px);
      border-radius: 14px;
      transition: transform .22s ease;
    }

    .track-panel.is-collapsed {
      transform: translateY(calc(100% - 50px));
    }

    .track-panel-header {
      padding: 8px 10px 10px;
    }

    .drawer-toggle {
      display: flex;
      width: 100%;
      height: 34px;
      align-items: center;
      justify-content: space-between;
      padding: 0;
      border: 0;
      background: transparent;
      color: #2f4a32;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    .drawer-summary {
      color: rgba(47, 74, 50, 0.72);
      font-size: 12px;
      font-weight: 650;
    }

    .track-panel-title {
      display: none;
    }

    .toolbar {
      margin: 8px 0;
    }

    .toolbar button {
      flex: 1 1 0;
      min-width: 0;
      padding: 7px 6px;
    }

    .search {
      padding: 8px 9px;
    }

    .tree {
      flex: 1 1 auto;
      min-height: 0;
    }

    .track-item {
      grid-template-columns: 18px 16px 42px minmax(0, 1fr);
      padding-left: 8px;
    }

    .profile-panel {
      position: static;
      width: auto;
      max-width: none;
      margin: 0 10px 10px;
      padding: 10px;
      box-shadow: none;
    }

    #elevationCanvas {
      height: 120px;
    }

    .opacity-panel {
      position: static;
      margin-top: 8px;
      padding: 7px 8px;
      box-shadow: none;
    }

    .opacity-panel input {
      flex: 1 1 auto;
      min-width: 0;
      width: auto;
    }
  }
</style>
</head>

<body>
<div id="map"></div>

<div class="panel">
  <div class="brand-title">West Lake Hiking Trails</div>
</div>

<div class="stats-panel">
  <div class="stats-title">统计</div>
  <div class="stats-grid">
    <div class="stat">
      <div class="stat-value" id="statsTracks">0/0</div>
      <div class="stat-label">轨迹</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statsDistance">0 km</div>
      <div class="stat-label">距离</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statsAscent">--</div>
      <div class="stat-label">累计爬升</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statsLatest">--</div>
      <div class="stat-label">最近</div>
    </div>
  </div>
</div>

<div class="explore-panel">
  <div class="explore-heading">
    <div class="explore-title">西湖群山点亮</div>
    <div class="explore-count" id="peakCount">载入中…</div>
  </div>
  <div class="explore-progress" aria-hidden="true">
    <div class="explore-progress-bar" id="peakProgress"></div>
  </div>
  <div class="explore-legend">
    <span><i class="legend-dot visited"></i>已到访</span>
    <span><i class="legend-dot unvisited"></i>未到访</span>
  </div>
  <div class="explore-actions">
    <button id="locateBtn" type="button">定位我</button>
    <button id="gridBtn" type="button" class="is-active">迷雾开启</button>
  </div>
  <label style="display:block;margin-top:8px;font-size:12px">轨迹两侧各
    <select id="fogRadius" aria-label="轨迹照亮半径"><option value="100">100 米</option><option value="200" selected>200 米</option></select>
  </label>
  <div class="location-status" id="locationStatus">轨迹经过山峰附近后会自动点亮</div>
  <details style="margin-top:6px;font-size:11px;line-height:1.5">
    <summary>8 处坐标待核实</summary>
    美女山、白云峰、马儿山、理安山、八觉山、屏风山、城隍山、孔家山。暂不标点、不计入点亮总数。
  </details>
</div>

<div class="track-panel is-collapsed">
  <div class="track-panel-header">
    <button class="drawer-toggle" id="drawerToggle" type="button" aria-expanded="false">
      <span>轨迹</span>
      <span class="drawer-summary" id="drawerSummary">0/0</span>
    </button>
    <div class="track-panel-title">轨迹</div>
    <div class="toolbar">
      <button id="showAllBtn">全部</button>
      <button id="recentBtn">最近10条</button>
      <button id="clearBtn">清空选择</button>
    </div>
    <input class="search" id="searchInput" placeholder="搜索日期或地点，例如 龙井、九溪、2026-06">
    <div class="selected-info" id="selectedInfo">
      <div class="selected-info-title" id="selectedInfoTitle"></div>
      <div class="selected-info-meta" id="selectedInfoMeta"></div>
    </div>
  </div>
  <div class="tree" id="trackTree"></div>
  <div class="empty" id="emptyBox">没有匹配的轨迹。</div>
</div>

<div class="profile-panel" id="profilePanel">
  <div class="profile-title" id="profileTitle">海拔剖面</div>
  <div class="profile-meta" id="profileMeta"></div>
  <canvas id="elevationCanvas"></canvas>
</div>

<div class="opacity-panel">
  <label for="baseOpacity">底图透明度</label>
  <input id="baseOpacity" type="range" min="0" max="100" value="30">
  <span id="baseOpacityValue">30%</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { preferCanvas: true, zoomControl: true });

const baseLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  opacity: 0.30,
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

const baseOpacity = document.getElementById('baseOpacity');
const baseOpacityValue = document.getElementById('baseOpacityValue');

baseLayer.setOpacity(Number(baseOpacity.value) / 100);
baseOpacityValue.textContent = `${baseOpacity.value}%`;

baseOpacity.addEventListener('input', () => {
  const value = Number(baseOpacity.value) / 100;
  baseLayer.setOpacity(value);
  baseOpacityValue.textContent = `${baseOpacity.value}%`;
});

const colors = [
  "#d73027", "#4575b4", "#1a9850", "#984ea3", "#ff7f00", "#a65628", "#f781bf",
  "#4daf4a", "#377eb8", "#e41a1c", "#666666", "#66c2a5", "#fc8d62", "#8da0cb",
  "#a6d854", "#ffd92f", "#e5c494", "#b3b3b3", "#1b9e77", "#d95f02", "#7570b3"
];

const trackTree = document.getElementById('trackTree');
const trackPanel = document.querySelector('.track-panel');
const trackPanelHeader = document.querySelector('.track-panel-header');
const drawerToggle = document.getElementById('drawerToggle');
const drawerSummary = document.getElementById('drawerSummary');
const emptyBox = document.getElementById('emptyBox');
const searchInput = document.getElementById('searchInput');
const selectedInfo = document.getElementById('selectedInfo');
const selectedInfoTitle = document.getElementById('selectedInfoTitle');
const selectedInfoMeta = document.getElementById('selectedInfoMeta');
const statsTracks = document.getElementById('statsTracks');
const statsDistance = document.getElementById('statsDistance');
const statsAscent = document.getElementById('statsAscent');
const statsLatest = document.getElementById('statsLatest');
const profilePanel = document.getElementById('profilePanel');
const profileTitle = document.getElementById('profileTitle');
const profileMeta = document.getElementById('profileMeta');
const elevationCanvas = document.getElementById('elevationCanvas');
const opacityPanel = document.querySelector('.opacity-panel');
const peakCount = document.getElementById('peakCount');
const peakProgress = document.getElementById('peakProgress');
const locateBtn = document.getElementById('locateBtn');
const gridBtn = document.getElementById('gridBtn');
const locationStatus = document.getElementById('locationStatus');
const profileHome = document.createComment('profile-panel-home');
const opacityHome = document.createComment('opacity-panel-home');
profilePanel.before(profileHome);
opacityPanel.before(opacityHome);

let trackGroups = [];
let selectedIndexes = new Set();
let allBounds = [];
let trackSegments = [];
let peaks = [];
let locationWatchId = null;
let locationMarker = null;
let accuracyCircle = null;
let hasCenteredOnLocation = false;

const PEAK_VISIT_RADIUS = 180;
const LOCATION_VISIT_RADIUS = 120;
const GRID_BOUNDS = { south: 30.10, west: 119.98, north: 30.35, east: 120.20 };
const GRID_STEP = { lat: 0.009, lng: 0.010 };
const BUILT_IN_PEAKS = [
  { id: 'node/2763362675', name: '北高峰', lat: 30.2479298, lng: 120.0920867 },
  { id: 'node/5162287122', name: '南高峰', lat: 30.2240207, lng: 120.1175872 },
  { id: 'node/4943773762', name: '玉皇山', lat: 30.2170488, lng: 120.1401096 },
  { id: 'node/4944239421', name: '凤凰山', lat: 30.2238036, lng: 120.1546560 },
  { id: 'node/4944239422', name: '将台山', lat: 30.2185245, lng: 120.1505742 },
  { id: 'node/756935539', name: '五云山', lat: 30.1983844, lng: 120.0952294 },
  { id: 'node/5580634142', name: '宝石山', lat: 30.2624214, lng: 120.1414080 },
  { id: 'node/9025915392', name: '丁家山', lat: 30.2415894, lng: 120.1287329 },
  { id: 'node/5027557773', name: '九曜山', lat: 30.2216970, lng: 120.1363021 },
  { id: 'node/4943673067', name: '虎跑山', lat: 30.2098872, lng: 120.1268163 },
  { id: 'node/5580633518', name: '大慈山', lat: 30.2109222, lng: 120.1326046 },
  { id: 'node/5580634140', name: '老和山', lat: 30.2708673, lng: 120.1141044 },
  { id: 'node/9020762381', name: '飞来峰', lat: 30.2388764, lng: 120.0964157 },
  { id: 'node/5580634127', name: '天竺山', lat: 30.2214212, lng: 120.0875784 },
  { id: 'node/5580634128', name: '狮峰', lat: 30.2158137, lng: 120.0925096 },
  { id: 'node/4943761652', name: '美人峰', lat: 30.2445676, lng: 120.0876553 },
  { id: 'node/9029237491', name: '五老峰', lat: 30.2314361, lng: 120.1205818 },
  { id: 'node/6021185475', name: '秦亭山', lat: 30.2687924, lng: 120.1122314 },
  { id: 'node/6021185473', name: '桃源岭', lat: 30.2563697, lng: 120.1045721 },
  { id: 'node/13984744141', name: '瑞云山', lat: 30.2535595, lng: 120.1029484 },
  { id: 'node/13984744140', name: '状元峰', lat: 30.2606195, lng: 120.1026969 },
  { id: 'node/5580634137', name: '锅子顶', lat: 30.2535446, lng: 120.1002083 },
  { id: 'node/28784701', name: '石人岭', lat: 30.2333777, lng: 120.0811256 },
  { id: 'node/770694138', name: '贵人峰（贵人阁参考点）', lat: 30.2134007, lng: 120.1209723 },
  { id: 'node/5580634121', name: '马鞍山', lat: 30.2064185, lng: 120.1162011 },
  { id: 'node/4944256638', name: '云居山', lat: 30.2347470, lng: 120.1575257 },

];
const peakLayer = L.layerGroup().addTo(map);
let fogRadius = 200;
const FogLayer = L.Layer.extend({
  onAdd(mapInstance) {
    this._map = mapInstance;
    this._canvas = L.DomUtil.create('canvas', 'history-fog');
    this._canvas.style.pointerEvents = 'none';
    this._canvas.style.position = 'absolute';
    mapInstance.getPane('fogPane').appendChild(this._canvas);
    mapInstance.on('moveend zoomend resize', this.redraw, this);
    this.redraw();
  },
  onRemove(mapInstance) {
    mapInstance.off('moveend zoomend resize', this.redraw, this);
    this._canvas.remove();
  },
  redraw() {
    if (!this._map || !this._canvas) return;
    const size = this._map.getSize();
    const dpr = window.devicePixelRatio || 1;
    const canvas = this._canvas;
    canvas.width = Math.round(size.x * dpr);
    canvas.height = Math.round(size.y * dpr);
    canvas.style.width = size.x + 'px';
    canvas.style.height = size.y + 'px';
    L.DomUtil.setPosition(canvas, this._map.containerPointToLayerPoint([0, 0]));
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = 'rgba(24, 37, 34, 0.70)';
    ctx.fillRect(0, 0, size.x, size.y);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = '#000';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const [a, b] of trackSegments) {
      const pa = this._map.latLngToContainerPoint(a);
      const pb = this._map.latLngToContainerPoint(b);
      const lat = (a[0] + b[0]) / 2;
      const metersPerPixel = 40075016.686 * Math.cos(lat * Math.PI / 180) / (256 * Math.pow(2, this._map.getZoom()));
      const radius = fogRadius / metersPerPixel;
      if (Math.max(pa.x, pb.x) < -radius || Math.min(pa.x, pb.x) > size.x + radius ||
          Math.max(pa.y, pb.y) < -radius || Math.min(pa.y, pb.y) > size.y + radius) continue;
      ctx.lineWidth = radius * 2;
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
});
map.createPane('fogPane');
map.getPane('fogPane').style.zIndex = 450;

function pointToSegmentDistance(point, a, b) {
  const lat0 = point[0] * Math.PI / 180;
  const scaleX = 111320 * Math.cos(lat0);
  const scaleY = 110540;
  const ax = (a[1] - point[1]) * scaleX;
  const ay = (a[0] - point[0]) * scaleY;
  const bx = (b[1] - point[1]) * scaleX;
  const by = (b[0] - point[0]) * scaleY;
  const dx = bx - ax;
  const dy = by - ay;
  const lengthSq = dx * dx + dy * dy;
  const t = lengthSq ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / lengthSq)) : 0;
  return Math.hypot(ax + dx * t, ay + dy * t);
}

function distanceToTrack(lat, lng) {
  let nearest = Infinity;
  for (const [a, b] of trackSegments) {
    nearest = Math.min(nearest, pointToSegmentDistance([lat, lng], a, b));
    if (nearest <= PEAK_VISIT_RADIUS) break;
  }
  return nearest;
}

function isPeakVisited(peak) {
  return peak.trackDistance <= PEAK_VISIT_RADIUS;
}

function peakIcon(visited) {
  return L.divIcon({
    className: '',
    html: `<div class="peak-marker ${visited ? 'visited' : ''}"><span>${visited ? '✓' : '△'}</span></div>`,
    iconSize: [20, 20],
    iconAnchor: [10, 20],
    popupAnchor: [0, -20]
  });
}

function renderPeaks() {
  peakLayer.clearLayers();
  let visitedCount = 0;

  peaks.forEach(peak => {
    const visited = isPeakVisited(peak);
    if (visited) visitedCount += 1;
    const elevation = peak.elevation ? `${peak.elevation} m` : '海拔未知';
    const trackDistance = Number.isFinite(peak.trackDistance)
      ? `距历史轨迹最近 ${formatDistance(peak.trackDistance)}`
      : '暂无历史轨迹';
    const marker = L.marker([peak.lat, peak.lng], { icon: peakIcon(visited), zIndexOffset: visited ? 300 : 200 });
    marker.bindTooltip(escapeHtml(peak.name), { direction: 'top', offset: [0, -18] });
    marker.bindPopup(`<b>${escapeHtml(peak.name)}</b><br>${visited ? '已点亮' : '尚未到访'} · ${elevation}<br>${trackDistance}`);
    marker.addTo(peakLayer);
  });

  peakCount.textContent = peaks.length ? `${visitedCount}/${peaks.length}` : '0/0';
  peakProgress.style.width = peaks.length ? `${visitedCount / peaks.length * 100}%` : '0%';
}

async function loadPeaks() {
  try {
    peaks = BUILT_IN_PEAKS.map(element => {
      const lat = Number(element.lat);
      const lng = Number(element.lng);
      return {
        id: element.id,
        lat,
        lng,
        name: element.name,
        elevation: null,
        trackDistance: distanceToTrack(lat, lng)
      };
    }).sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));

    renderPeaks();
    locationStatus.textContent = '绿色山峰已点亮，灰色山峰等你去走';
  } catch (err) {
    peakCount.textContent = '暂不可用';
    locationStatus.textContent = '山峰数据暂时无法载入，轨迹和实时定位仍可使用';
  }
}

function nearestPeakTo(lat, lng) {
  let nearest = null;
  peaks.forEach(peak => {
    const distance = haversineDistance([lat, lng], [peak.lat, peak.lng]);
    if (!nearest || distance < nearest.distance) nearest = { peak, distance };
  });
  return nearest;
}

function updateLiveLocation(position) {
  const { latitude, longitude, accuracy } = position.coords;
  const latlng = [latitude, longitude];
  const locationIcon = L.divIcon({ className: '', html: '<div class="you-are-here"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });

  if (!locationMarker) {
    locationMarker = L.marker(latlng, { icon: locationIcon, zIndexOffset: 1000 }).addTo(map);
    accuracyCircle = L.circle(latlng, { radius: accuracy, weight: 1, color: '#3478f6', fillOpacity: .08 }).addTo(map);
  } else {
    locationMarker.setLatLng(latlng);
    accuracyCircle.setLatLng(latlng).setRadius(accuracy);
  }

  const trackDistance = distanceToTrack(latitude, longitude);
  const areaVisited = trackDistance <= LOCATION_VISIT_RADIUS;
  const areaText = Number.isFinite(trackDistance)
    ? `${areaVisited ? '这里走过' : '这里没走过'} · ${areaVisited ? '距历史轨迹' : '离最近轨迹'} ${formatDistance(trackDistance)}`
    : '暂无历史轨迹可供对照';
  const nearest = nearestPeakTo(latitude, longitude);
  if (nearest) {
    const peakText = isPeakVisited(nearest.peak) ? '已点亮' : '未点亮';
    locationStatus.textContent = `${areaText} · ${nearest.peak.name} ${formatDistance(nearest.distance)}（${peakText}）· 精度 ±${Math.round(accuracy)} m`;
  } else {
    locationStatus.textContent = `${areaText} · 精度 ±${Math.round(accuracy)} m`;
  }

  if (!hasCenteredOnLocation) {
    map.setView(latlng, Math.max(map.getZoom(), 15));
    hasCenteredOnLocation = true;
  }
}

function handleLocationError(error) {
  const messages = {
    1: '没有定位权限，请在浏览器设置中允许位置访问',
    2: '暂时无法获取位置，请到开阔处重试',
    3: '定位超时，请再试一次'
  };
  locationStatus.textContent = messages[error.code] || '实时定位失败';
  stopLiveLocation(false);
}

function startLiveLocation() {
  if (!navigator.geolocation) {
    locationStatus.textContent = '当前浏览器不支持实时定位';
    return;
  }
  locationStatus.textContent = '正在获取实时位置…';
  locateBtn.textContent = '停止定位';
  locateBtn.classList.add('is-active');
  locationWatchId = navigator.geolocation.watchPosition(updateLiveLocation, handleLocationError, {
    enableHighAccuracy: true,
    maximumAge: 5000,
    timeout: 15000
  });
}

function stopLiveLocation(updateText = true) {
  if (locationWatchId !== null) navigator.geolocation.clearWatch(locationWatchId);
  locationWatchId = null;
  locateBtn.textContent = '定位我';
  locateBtn.classList.remove('is-active');
  if (updateText) locationStatus.textContent = '实时定位已暂停；点亮状态只由导入的轨迹决定';
}

function yearOf(dateText) {
  return /^\d{4}-\d{2}-\d{2}/.test(dateText) ? dateText.slice(0, 4) : "未知年份";
}

function monthOf(dateText) {
  return /^\d{4}-\d{2}-\d{2}/.test(dateText) ? dateText.slice(5, 7) + "月" : "未知月份";
}

function decodeText(value) {
  const text = String(value || "").trim();
  try {
    return decodeURIComponent(text);
  } catch (err) {
    return text;
  }
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "\"": "&quot;",
    "'": "&#39;"
  }[ch]));
}

function labelOf(track) {
  const p = track.properties;
  return `${p.date || ""} ${p.title || ""}`.trim();
}

function haversineDistance(a, b) {
  const R = 6371000;
  const lat1 = a[0] * Math.PI / 180;
  const lat2 = b[0] * Math.PI / 180;
  const dLat = (b[0] - a[0]) * Math.PI / 180;
  const dLon = (b[1] - a[1]) * Math.PI / 180;

  const x =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1) * Math.cos(lat2) *
    Math.sin(dLon / 2) * Math.sin(dLon / 2);

  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}

function finiteNumber(value) {
  return Number.isFinite(Number(value)) ? Number(value) : null;
}

function formatDistance(meters) {
  if (!Number.isFinite(meters)) return "--";
  if (meters >= 1000) return `${(meters / 1000).toFixed(2)} km`;
  return `${Math.round(meters)} m`;
}

function formatMeters(meters) {
  if (!Number.isFinite(meters)) return "--";
  return `${Math.round(meters)} m`;
}

function selectedTracks() {
  return trackGroups.filter(g => selectedIndexes.has(g.index));
}

function aggregateStats(tracks) {
  return tracks.reduce((stats, track) => {
    const p = track.properties;
    stats.count += 1;
    stats.distance += finiteNumber(p.distance) || 0;
    stats.points += finiteNumber(p.points) || 0;

    if (p.hasElevation) {
      stats.hasElevation = true;
      stats.ascent += finiteNumber(p.ascent) || 0;
      stats.descent += finiteNumber(p.descent) || 0;
    }

    if (p.date && p.date > stats.latest) {
      stats.latest = p.date;
    }

    return stats;
  }, { count: 0, distance: 0, ascent: 0, descent: 0, points: 0, latest: "", hasElevation: false });
}

function boundsForTracks(tracks) {
  const bounds = [];
  tracks.forEach(track => {
    track.lines.forEach(line => {
      bounds.push(...line.getLatLngs());
    });
  });
  return bounds;
}

function fitSelectedTracks() {
  const tracks = selectedTracks();
  const bounds = boundsForTracks(tracks);

  if (bounds.length) {
    map.fitBounds(bounds, { padding: [30, 30] });
  }
}

function updateStatsPanel() {

  statsDistance.textContent = formatDistance(stats.distance);

  statsLatest.textContent = stats.latest ? stats.latest.slice(5) : "--";
  updateDrawerSummary();
}

function updateSelectedInfo() {

  if (!tracks.length) {

  if (tracks.length === 1) {

    selectedInfoTitle.textContent = name || "未命名轨迹";
    selectedInfoMeta.textContent = `距离：${formatDistance(p.distance)}　轨迹点：${p.points}${elevation}`;
    return;
  }

  selectedInfoTitle.textContent = `已选择 ${tracks.length} 条轨迹`;
  selectedInfoMeta.textContent = `距离：${formatDistance(stats.distance)}　轨迹点：${Math.round(stats.points)}${stats.hasElevation ? `　累计爬升：${formatMeters(stats.ascent)}` : ""}`;
}

function drawElevationProfile(track) {
  if (!track || track.profile.length < 2) {
    profilePanel.style.display = "none";
    return;
  }

  profilePanel.style.display = "block";
  const p = track.properties;
  profileTitle.textContent = p.title || "海拔剖面";
  profileMeta.textContent = `${p.date || ""}　${formatDistance(p.distance)}　爬升 ${formatMeters(p.ascent)}`.trim();

  const rect = elevationCanvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const width = Math.max(280, rect.width);
  const height = Math.max(110, rect.height);
  elevationCanvas.width = Math.round(width * dpr);
  elevationCanvas.height = Math.round(height * dpr);

  const ctx = elevationCanvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);

  const pad = { left: 38, right: 12, top: 14, bottom: 26 };
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom;
  const elevations = track.profile.map(point => point.elevation);
  const distances = track.profile.map(point => point.distance);
  const minEle = Math.min(...elevations);
  const maxEle = Math.max(...elevations);
  const maxDist = Math.max(...distances);
  const eleSpan = Math.max(1, maxEle - minEle);

  const x = distance => pad.left + (maxDist ? distance / maxDist : 0) * plotW;
  const y = elevation => pad.top + (1 - (elevation - minEle) / eleSpan) * plotH;

  ctx.font = "11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
  ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(47, 74, 50, 0.12)";
  ctx.fillStyle = "rgba(47, 74, 50, 0.62)";

  for (let i = 0; i <= 3; i++) {
    const yy = pad.top + (plotH * i / 3);
    const ele = maxEle - eleSpan * i / 3;
    ctx.beginPath();
    ctx.moveTo(pad.left, yy);
    ctx.lineTo(width - pad.right, yy);
    ctx.stroke();
    ctx.fillText(`${Math.round(ele)}m`, 2, yy + 4);
  }

  const gradient = ctx.createLinearGradient(0, pad.top, 0, height - pad.bottom);
  gradient.addColorStop(0, `${track.color}66`);
  gradient.addColorStop(1, `${track.color}08`);

  ctx.beginPath();
  track.profile.forEach((point, i) => {
    const px = x(point.distance);
    const py = y(point.elevation);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  });
  ctx.lineTo(x(maxDist), height - pad.bottom);
  ctx.lineTo(x(0), height - pad.bottom);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.beginPath();
  track.profile.forEach((point, i) => {
    const px = x(point.distance);
    const py = y(point.elevation);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  });
  ctx.strokeStyle = track.color;
  ctx.lineWidth = 2.2;
  ctx.stroke();

  ctx.fillStyle = "rgba(47, 74, 50, 0.74)";
  ctx.fillText("0", pad.left, height - 8);
  ctx.textAlign = "right";
  ctx.fillText(formatDistance(maxDist), width - pad.right, height - 8);
  ctx.textAlign = "left";
}

function updateProfile() {
  const tracks = selectedTracks();

  if (tracks.length !== 1 || tracks[0].profile.length < 2) {
    profilePanel.style.display = "none";
    return;
  }

  drawElevationProfile(tracks[0]);
}

function updatePanels() {
  updateStatsPanel();
  updateSelectedInfo();
  updateProfile();
}

function syncVisibleTracks() {
  trackGroups.forEach(group => {
    const selected = selectedIndexes.has(group.index);
    const single = selectedIndexes.size === 1;

    group.lines.forEach(line => {
      if (selected) {
        if (!map.hasLayer(line)) line.addTo(map);
        line.setStyle({
          weight: single ? 5.5 : 3.5,
          opacity: single ? 1 : 0.82
        });
        if (single) line.bringToFront();
      } else if (map.hasLayer(line)) {
        map.removeLayer(line);
      }
    });

    group.hitLines.forEach(hitLine => {
      if (selected) {
        if (!map.hasLayer(hitLine)) hitLine.addTo(map);
        hitLine.bringToFront();
      } else if (map.hasLayer(hitLine)) {
        map.removeLayer(hitLine);
      }
    });
  });

  document.querySelectorAll('.track-item').forEach(el => {
    const index = Number(el.dataset.index);
    el.classList.toggle('active', selectedIndexes.has(index));
  });

  document.querySelectorAll('.track-check').forEach(el => {
    const index = Number(el.dataset.index);
    el.checked = selectedIndexes.has(index);
  });
}

function applySelection(indexes, options = {}) {
  const { fit = true } = options;
  selectedIndexes = new Set(indexes);
  syncVisibleTracks();
  renderTree();
  updatePanels();

  if (fit) {
    fitSelectedTracks();
  }
}

function toggleTrack(index) {
  const next = new Set(selectedIndexes);
  if (next.has(index)) next.delete(index);
  else next.add(index);
  applySelection(next);
}

function focusTrack(index) {
  applySelection([index]);
}

function showAll() {
  applySelection(trackGroups.map(g => g.index));
}

map.on('click', () => {
  if (selectedIndexes.size === 1) {
    showAll();
  }
});

function showRecent(limit = 10) {
  const recent = [...trackGroups]
    .sort((a, b) => (b.properties.date || "").localeCompare(a.properties.date || ""))
    .slice(0, limit)
    .map(g => g.index);
  applySelection(recent);
}

function clearSelection() {
  applySelection([]);
}

function renderTree() {
  const query = searchInput.value.trim().toLowerCase();
  trackTree.innerHTML = "";

  let tracks = [...trackGroups];

  if (query) {
    tracks = tracks.filter(g => labelOf(g).toLowerCase().includes(query));
  }

  tracks.sort((a, b) => {
    const da = a.properties.date || "";
    const db = b.properties.date || "";
    return db.localeCompare(da) || String(a.properties.title).localeCompare(String(b.properties.title));
  });

  const grouped = new Map();

  tracks.forEach(g => {
    const y = yearOf(g.properties.date);
    const m = monthOf(g.properties.date);

    if (!grouped.has(y)) grouped.set(y, new Map());
    if (!grouped.get(y).has(m)) grouped.get(y).set(m, []);
    grouped.get(y).get(m).push(g);
  });

  const years = Array.from(grouped.keys()).sort((a, b) => b.localeCompare(a));
  emptyBox.style.display = years.length ? "none" : "block";

  const latestYear = years[0];
  let latestMonth = null;

  if (latestYear) {
    latestMonth = Array.from(grouped.get(latestYear).keys()).sort((a, b) => b.localeCompare(a))[0];
  }

  years.forEach(year => {
    const yearDetails = document.createElement("details");
    yearDetails.open = query || year === latestYear;
    yearDetails.className = "year";

    const yearSummary = document.createElement("summary");
    const count = Array.from(grouped.get(year).values()).reduce((sum, arr) => sum + arr.length, 0);
    yearSummary.textContent = `${year}（${count}）`;
    yearDetails.appendChild(yearSummary);

    const months = Array.from(grouped.get(year).keys()).sort((a, b) => b.localeCompare(a));

    months.forEach(month => {
      const monthDetails = document.createElement("details");
      monthDetails.open = query || (year === latestYear && month === latestMonth);
      monthDetails.className = "month";

      const monthSummary = document.createElement("summary");
      monthSummary.textContent = `${month}（${grouped.get(year).get(month).length}）`;
      monthDetails.appendChild(monthSummary);

      grouped.get(year).get(month).forEach(g => {
        const p = g.properties;

        const item = document.createElement("div");
        item.className = "track-item";
        item.dataset.index = g.index;
        item.classList.toggle("active", selectedIndexes.has(g.index));
        item.title = `${labelOf(g)}｜${formatDistance(p.distance)}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "track-check";
        checkbox.dataset.index = g.index;
        checkbox.checked = selectedIndexes.has(g.index);
        checkbox.onclick = event => event.stopPropagation();
        checkbox.onchange = () => toggleTrack(g.index);

        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.background = g.color;

        const date = document.createElement("span");
        date.className = "track-date";
        date.textContent = p.date ? p.date.slice(5) : "--";

        const title = document.createElement("span");
        title.className = "track-title";
        title.textContent = p.title || "未命名轨迹";

        item.appendChild(checkbox);
        item.appendChild(swatch);
        item.appendChild(date);
        item.appendChild(title);

        item.onclick = () => toggleTrack(g.index);

        monthDetails.appendChild(item);
      });

      yearDetails.appendChild(monthDetails);
    });

    trackTree.appendChild(yearDetails);
  });
}

async function loadTracks() {
  let res = await fetch('tracks.geojson?ts=' + Date.now());
  if (!res.ok) res = await fetch('preview/tracks.geojson?ts=' + Date.now());
  if (!res.ok) throw new Error('tracks.geojson unavailable');
  const geo = await res.json();

  const byTrack = new Map();

  for (const feature of geo.features) {
    const p = feature.properties || {};

    if (p.visible === false) continue;

    if (!byTrack.has(p.id)) {
      byTrack.set(p.id, {
        properties: {
          ...p,
          title: decodeText(p.title)
        },
        features: []
      });
    }

    byTrack.get(p.id).features.push(feature);
  }

  const tracks = Array.from(byTrack.values()).sort((a, b) => {
    const da = a.properties.date || "";
    const db = b.properties.date || "";
    return da.localeCompare(db) || a.properties.id - b.properties.id;
  });

  tracks.forEach((trk, i) => {
    const color = colors[i % colors.length];
    const lines = [];
    const hitLines = [];
    const profile = [];
    let totalPoints = 0;
    let totalDistance = 0;
    let totalAscent = 0;
    let totalDescent = 0;
    let minElevation = null;
    let maxElevation = null;
    let hasElevation = false;
    let profileDistance = 0;

    trk.features.forEach(feature => {
      const coords = feature.geometry.coordinates || [];
      const latlngs = coords.map(c => [c[1], c[0]]);
      totalPoints += latlngs.length;

      for (let j = 1; j < latlngs.length; j++) {
        trackSegments.push([latlngs[j - 1], latlngs[j]]);
      }

      const featureDistance = finiteNumber(feature.properties?.distance);
      totalDistance += featureDistance || 0;

      if (!featureDistance) {
        for (let j = 1; j < latlngs.length; j++) {
          totalDistance += haversineDistance(latlngs[j - 1], latlngs[j]);
        }
      }

      totalAscent += finiteNumber(feature.properties?.ascent) || 0;
      totalDescent += finiteNumber(feature.properties?.descent) || 0;

      const featureMin = finiteNumber(feature.properties?.min_elevation);
      const featureMax = finiteNumber(feature.properties?.max_elevation);
      if (featureMin !== null && featureMax !== null) {
        hasElevation = true;
        minElevation = minElevation === null ? featureMin : Math.min(minElevation, featureMin);
        maxElevation = maxElevation === null ? featureMax : Math.max(maxElevation, featureMax);
      }

      let lastLatLng = null;
      coords.forEach(c => {
        const latlng = [c[1], c[0]];
        if (lastLatLng) {
          profileDistance += haversineDistance(lastLatLng, latlng);
        }

        const elevation = finiteNumber(c[2]);
        if (elevation !== null) {
          profile.push({ distance: profileDistance, elevation });
        }

        lastLatLng = latlng;
      });

      allBounds.push(...latlngs);

      const line = L.polyline(latlngs, {
        color,
        weight: 3.5,
        opacity: 0.82,
        lineJoin: 'round',
        lineCap: 'round'
      });

      line.on('click', () => focusTrack(i));
      lines.push(line);

      const hitLine = L.polyline(latlngs, {
        color,
        weight: 18,
        opacity: 0,
        lineJoin: 'round',
        lineCap: 'round',
        bubblingMouseEvents: false
      });

      hitLine.on('click', event => {
        L.DomEvent.stop(event);
        focusTrack(i);
      });
      hitLine.on('mouseover', () => {
        map.getContainer().style.cursor = 'pointer';
      });
      hitLine.on('mouseout', () => {
        map.getContainer().style.cursor = '';
      });
      hitLines.push(hitLine);
    });

    const p = trk.properties;
    const title = p.title || "未命名轨迹";
    const label = p.date ? `${p.date}｜${title}` : title;
    const popup = [
      `<b>${escapeHtml(label)}</b>`,
      `距离：${formatDistance(totalDistance)}`,
      `轨迹点：${totalPoints}`
    ];

    if (hasElevation) {
      popup.push(`爬升：${formatMeters(totalAscent)}`);
      popup.push(`下降：${formatMeters(totalDescent)}`);
    }

    lines.forEach(line => {
      line.bindPopup(popup.join('<br/>'));
    });

    trackGroups.push({
      index: i,
      color,
      lines,
      hitLines,
      profile,
      properties: {
        ...p,
        title,
        points: totalPoints,
        distance: totalDistance,
        ascent: totalAscent,
        descent: totalDescent,
        minElevation,
        maxElevation,
        hasElevation
      }
    });
  });

  selectedIndexes = new Set(trackGroups.map(g => g.index));
  renderTree();
  syncVisibleTracks();
  updatePanels();
  renderExplorationGrid();
  await loadPeaks();

  if (allBounds.length) {
    map.fitBounds(allBounds, { padding: [25, 25] });
  } else {
    map.setView([30.24, 120.10], 13);
  }
}

document.getElementById("showAllBtn").onclick = showAll;
document.getElementById("recentBtn").onclick = () => showRecent(10);
document.getElementById("clearBtn").onclick = clearSelection;
locateBtn.onclick = () => locationWatchId === null ? startLiveLocation() : stopLiveLocation();
gridBtn.onclick = () => {
  if (map.hasLayer(gridLayer)) {
    map.removeLayer(gridLayer);
    gridBtn.classList.remove('is-active');
    gridBtn.textContent = '迷雾关闭';
  } else {
    gridLayer.addTo(map);
    gridBtn.classList.add('is-active');
    gridBtn.textContent = '迷雾开启';
  }
};
document.getElementById('fogRadius').onchange = event => {
  fogRadius = Number(event.target.value);
  renderExplorationGrid();
};
baseOpacity.value = '100';
baseOpacityValue.textContent = '100%';
baseLayer.setOpacity(1);
drawerToggle.onclick = () => {
  trackPanel.classList.toggle('is-collapsed');
  drawerToggle.setAttribute('aria-expanded', String(!trackPanel.classList.contains('is-collapsed')));
};
searchInput.addEventListener("input", renderTree);
window.addEventListener('resize', () => {
  syncResponsivePanels();
  updateProfile();
});
syncResponsivePanels();

loadTracks().catch(err => {
  console.error(err);
  alert("轨迹加载失败，请检查 tracks.geojson。");
});
</script>
</body>
</html>
